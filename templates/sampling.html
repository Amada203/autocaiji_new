<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>采样计划 - 商品价格变动预测系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            background: #f6f8fa;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
        }
        .main-bg {
            background: linear-gradient(135deg, #e3f0ff 0%, #f6f8fa 100%);
            min-height: 100vh;
        }
        .card {
            border-radius: 18px;
            box-shadow: 0 4px 24px 0 rgba(0,0,0,0.06);
        }
        .card-header {
            background: linear-gradient(90deg, #2563eb 0%, #60a5fa 100%);
            color: #fff;
            border-radius: 18px 18px 0 0;
        }
        .stat-card {
            background: linear-gradient(135deg, #dbeafe 0%, #f0f9ff 100%);
            border: none;
            border-radius: 16px;
            box-shadow: 0 2px 12px 0 rgba(37,99,235,0.08);
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: #2563eb;
        }
        .stat-label {
            font-size: 1rem;
            color: #64748b;
        }
        .btn, .form-control {
            border-radius: 10px;
            box-shadow: 0 1px 4px 0 rgba(0,0,0,0.04);
        }
        .btn-primary {
            background: linear-gradient(90deg, #2563eb 0%, #60a5fa 100%);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(90deg, #1d4ed8 0%, #3b82f6 100%);
        }
        .pagination .page-link {
            border-radius: 8px;
        }
        .footer {
            border-radius: 0 0 18px 18px;
        }
        .empty-illustration {
            width: 120px;
            margin: 24px auto 8px auto;
            display: block;
        }
        @media (max-width: 767px) {
            .card-header {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body class="main-bg">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm rounded mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 text-primary" href="/">
                <i class="bi bi-bar-chart-line-fill me-2"></i>商品价格变动预测系统
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/predictions">预测结果</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/sampling">采样计划</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/stats">统计信息</a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="loginBtn">登录</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="userInfo" style="display: none;"></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutBtn" style="display: none;">退出</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="fw-bold">采样计划</h1>
            <div>
                <button class="btn btn-primary me-2" id="refreshBtn">
                    <i class="bi bi-arrow-clockwise"></i> 刷新
                </button>
                <button class="btn btn-success me-2" id="generateBtn">
                    <i class="bi bi-plus-circle"></i> 生成新计划
                </button>
                <button class="btn btn-outline-info me-2" id="historyBtn">
                    <i class="bi bi-clock-history"></i> 历史计划
                </button>
                <button class="btn btn-outline-success" id="exportBtn">
                    <i class="bi bi-download"></i> 导出
                </button>
            </div>
        </div>
        <div class="card stat-card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">今日采样计划概览</h5>
                <button class="btn btn-outline-success btn-sm" id="exportOverviewBtn"><i class="bi bi-download"></i> 导出概览</button>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-3">
                        <div class="text-center">
                            <div class="stat-label">日期</div>
                            <div class="stat-number" id="planDate">-</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="text-center">
                            <div class="stat-label">采样SKU数</div>
                            <div class="stat-number" id="sampledCount">-</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="text-center">
                            <div class="stat-label">采样率</div>
                            <div class="stat-number" id="samplingRate">-</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="text-center">
                            <div class="stat-label">成本节省</div>
                            <div class="stat-number" id="costSaving">-</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">SKU列表</h5>
                <div>
                    <button class="btn btn-outline-primary btn-sm me-2" id="filterBtn"><i class="bi bi-funnel"></i> 筛选</button>
                    <button class="btn btn-outline-success btn-sm" id="exportTableBtn"><i class="bi bi-download"></i> 导出表格</button>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>序号</th>
                                <th>SKU ID</th>
                                <th>变动概率</th>
                                <th>类别</th>
                                <th>价格档位</th>
                            </tr>
                        </thead>
                        <tbody id="skuTable">
                            <tr>
                                <td colspan="5" class="text-center py-5">
                                    <img src="/static/img/empty.svg" class="empty-illustration" alt="加载中">
                                    <div class="text-muted">加载中...</div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <nav>
                    <ul class="pagination justify-content-center my-3" id="pagination">
                    </ul>
                </nav>
            </div>
        </div>
    </div>
    <!-- 生成计划模态框 -->
    <div class="modal fade" id="generateModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">生成新采样计划</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="generateForm">
                        <div class="mb-3">
                            <label for="predictionDate" class="form-label">预测日期</label>
                            <input type="date" class="form-control" id="predictionDate">
                        </div>
                        <div class="mb-3">
                            <label for="targetCaptureRate" class="form-label">目标捕捉率</label>
                            <input type="range" class="form-range" id="targetCaptureRate" min="0.8" max="1" step="0.01" value="0.95">
                            <div class="d-flex justify-content-between">
                                <span>80%</span>
                                <span id="captureRateValue">95%</span>
                                <span>100%</span>
                            </div>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="useStratified" checked>
                            <label class="form-check-label" for="useStratified">使用分层采样</label>
                        </div>
                        <div class="mb-3">
                            <label for="maxSamples" class="form-label">最大采样数量 (可选)</label>
                            <input type="number" class="form-control" id="maxSamples" min="1">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="generateSubmit">生成</button>
                </div>
            </div>
        </div>
    </div>
    <!-- 登录模态框 -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">用户登录</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="username" class="form-label">用户名</label>
                            <input type="text" class="form-control" id="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">密码</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <div class="alert alert-danger d-none" id="loginError"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="loginSubmit">登录</button>
                </div>
            </div>
        </div>
    </div>
    <footer class="footer mt-5 py-3 bg-light">
        <div class="container text-center">
            <span class="text-muted">商品价格变动预测系统 &copy; 2024</span>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/sampling.js"></script>
</body>
</html>
